services:
  api:
    build:
      context: ./server
    environment:
      - PORT=4000
      - DOCKER_SOCKET=/var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # Set DOCKER_GID in a .env file: `DOCKER_GID=$(stat -c '%g' /var/run/docker.sock)`
    group_add:
      - "${DOCKER_GID}"
    security_opt:
      - "apparmor=unconfined"
    ports:
      - "4000:4000"
    restart: unless-stopped

  web:
    build:
      context: ./client
    depends_on:
      - api
    security_opt:
      - "seccomp=unconfined"
      - "apparmor=unconfined"
    ports:
      - "8080:80"
    restart: unless-stopped
